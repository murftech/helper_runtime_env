[project]
name = "runtime_env"
version = "0.1.0"
description = "which runtime is this (sh / ipython / databricks), + put the caller's src/ on sys.path"
requires-python = ">=3.12"
dependencies = []
# no runtime deps - stdlib only (os, sys, pathlib)

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["runtime_env"]
